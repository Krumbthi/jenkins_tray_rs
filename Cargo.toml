[package]
name = "jenkins_tray"
# The port's own version (the original C# application was 1.0.5.0; update
# checks compare it against scripts/version.properties, see app_update.rs).
version = "0.4.0"
edition = "2024"
authors = ["Thilo Krumbholz"]
description = "A Rust + Slint application"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Krumbthi/jenkins_tray_rs.git"

# Windows executable metadata (file Properties dialog, Task Manager) - build.rs
# also embeds assets/icon.ico. These override the values winresource would
# otherwise derive from [package] (which would be the raw crate name).
[package.metadata.winresource]
ProductName = "Jenkins Tray"
FileDescription = "Jenkins build monitor for the Windows system tray"
OriginalFilename = "jenkins_tray.exe"
CompanyName = ""

[dependencies]
slint = "1.18.1"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "cookies", "rustls-tls"] }
serde_json = "1.0"
env_logger = "0.10"
chrono = "0.4"
roxmltree = "0.21.1"
keyring = { version = "4.2", features = ["v1"] }
# Single-instance file lock, like the user's project_tracker client: a
# second launch asks the running instance to show its window instead.
fs2 = "0.4"

# Linux tray: pure-Rust StatusNotifierItem (icon/menu/clicks) + the
# freedesktop Notifications bus (balloons). Both degrade to logging when no
# tray host / notification daemon is running (e.g. under WSLg).
# default-features = false: ksni's default `tokio` executor conflicts with the
# `async-io` feature slint enables for its own ksni usage.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", features = ["blocking"] }

# Windows: project_tracker's Win32 dependency is the `windows-sys` crate
# (0.52). The tray itself is Slint's built-in `SystemTrayIcon` - there is no
# hand-rolled Win32 code (matching project_tracker exactly); windows-sys is
# kept to mirror that project's setup.
# Required features for Windows resource embedding and credential encryption:
#   Win32_Foundation   - BOOL, HLOCAL, LocalFree
#   Win32_System_Memory - LocalFree (from System::Memory)
#   Win32_Security_Cryptography - CryptProtectData/CryptUnprotectData
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security_Cryptography",
] }
# Registry access for the autostart feature (HKCU\...\Run key).
winreg = "0.55"

[build-dependencies]
slint-build = "1.18.1"
# Embeds the Windows app icon + version info into the .exe (see build.rs).
# Compiles on any host; build.rs only runs it when the *target* is Windows.
winresource = "0.1.34"

[profile.release]
codegen-units = 1
lto = true
