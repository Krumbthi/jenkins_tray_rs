[package]
name = "jenkins_tray"
version = "0.1.0"
edition = "2024"
authors = ["Jenkins Tray Rust Team"]
description = "A Rust + Slint application"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jenkins-tray/jenkins-tray-rs"

[dependencies]
slint = "1.18.1"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "cookies", "rustls-tls"] }
serde_json = "1.0"
env_logger = "0.10"
chrono = "0.4"
roxmltree = "0.21.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
