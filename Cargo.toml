[package]
name = "jenkins_tray"
# Matches the original application's FileVersion (1.0.5.0) so the update feed
# comparison and the window title behave exactly like the C# original.
version = "1.0.5"
edition = "2024"
authors = ["Jenkins Tray Rust Team"]
description = "A Rust + Slint application"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jenkins-tray/jenkins-tray-rs"

[dependencies]
slint = "1.18.1"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "cookies", "rustls-tls"] }
serde_json = "1.0"
env_logger = "0.10"
chrono = "0.4"
roxmltree = "0.21.1"

# Linux tray: pure-Rust StatusNotifierItem (icon/menu/clicks) + the
# freedesktop Notifications bus (balloons). Both degrade to logging when no
# tray host / notification daemon is running (e.g. under WSLg).
# default-features = false: ksni's default `tokio` executor conflicts with the
# `async-io` feature slint enables for its own ksni usage.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", features = ["blocking"] }

# Windows tray: hand-rolled Shell_NotifyIconW backend (icon, tooltip, menu,
# NIF_INFO balloons) - no crate covers balloons.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
